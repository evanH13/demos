name: 'jaffle_shop_cosmos'
version: '1.0.0'
config-version: 2
profile: 'jaffle_shop_cosmos'
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
models:
  jaffle_shop_cosmos:
    +materialized: table
    +alias: "EVAN_{{ model.name | upper }}"
    staging:
      +materialized: view
      +alias: "EVAN_{{ model.name | upper }}"
      +schema: DEMO
    marts:
      +materialized: table
      +alias: "EVAN_{{ model.name | upper }}"
      +schema: DEMO
seeds:
  jaffle_shop_cosmos:
    +schema: DEMO
    +quote_columns: false
dispatch:
  - macro_namespace: dbt_utils
    search_order: ['dbt_utils', 'dbt']
