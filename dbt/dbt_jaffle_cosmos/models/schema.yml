version: 2
models:
  - name: stg_customers
    columns:
      - name: CUSTOMER_ID
        tests: [unique, not_null]
      - name: FULL_NAME
        tests: [not_null]

  - name: stg_orders
    columns:
      - name: ORDER_ID
        tests: [unique, not_null]
      - name: CUSTOMER_ID
        tests: [not_null]

  - name: stg_payments
    columns:
      - name: PAYMENT_ID
        tests: [unique, not_null]
      - name: ORDER_ID
        tests: [not_null]

  - name: dim_customers
    columns:
      - name: CUSTOMER_ID
        tests: [unique, not_null]

  - name: fct_orders
    columns:
      - name: ORDER_ID
        tests: [unique, not_null]
      - name: STATUS
        tests:
          - accepted_values:
              values: ['completed', 'shipped', 'returned', 'return_pending', 'placed']